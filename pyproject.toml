[project]
name = "tp4a-streamlit"
version = "0.1.0"
description = "ReAct agent (LangChain 1.x + Groq) with a Streamlit GUI"
requires-python = ">=3.12"
dependencies = [
    "arxiv>=4.0.1",
    "chromadb>=1.5.9",
    "langchain>=1.4.7",
    "langchain-chroma>=1.1.0",
    "langchain-core>=1.7.0",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.3",
    "langchain-tavily>=0.2.18",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.17",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.2.0",
    "streamlit>=1.40.0",
    "tavily-python>=0.8.5",
    "tiktoken>=0.14.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
